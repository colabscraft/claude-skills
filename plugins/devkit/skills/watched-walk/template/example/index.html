<!doctype html>
<!-- The example app the example section walks: add a task, refuse an empty one. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example tasks</title>
<style>
  body { font: 16px system-ui, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; font: inherit; }
  button { padding: 8px 16px; font: inherit; }
  li { padding: 6px 0; border-bottom: 1px solid #ddd; }
  [role=alert] { color: #b91c1c; min-height: 1.5em; }
  [role=status] { position: fixed; right: 16px; bottom: 16px; background: #15803d; color: #fff; padding: 8px 14px; border-radius: 8px; }
</style>
</head>
<body>
<h1>Tasks</h1>
<form id="add">
  <label for="title" hidden>Title</label>
  <input id="title" placeholder="New task" aria-label="Title">
  <button type="submit">Add</button>
</form>
<p role="alert" id="error"></p>
<ul aria-label="Tasks" id="list"></ul>
<script>
  const list = document.getElementById('list');
  const error = document.getElementById('error');
  document.getElementById('add').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('title');
    const title = input.value.trim();
    if (!title) { error.textContent = 'Please enter a title'; return; }
    error.textContent = '';
    const li = document.createElement('li');
    li.textContent = title;
    list.append(li);
    input.value = '';
    const toast = document.createElement('div');
    toast.setAttribute('role', 'status');
    toast.textContent = 'Saved';
    document.body.append(toast);
    setTimeout(() => toast.remove(), 2500);
  });
</script>
</body>
</html>
